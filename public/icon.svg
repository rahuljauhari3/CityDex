<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- CityDex original pixel mark: a parchment stamp with a grass pin -->
  <rect width="32" height="32" fill="#5B3A29"/>
  <rect x="3" y="3" width="26" height="26" fill="#F4E4C1"/>
  <rect x="3" y="3" width="26" height="2" fill="#A0703C"/>
  <rect x="3" y="27" width="26" height="2" fill="#A0703C"/>
  <!-- pin head -->
  <rect x="12" y="7" width="8" height="8" fill="#C0392B"/>
  <rect x="14" y="9" width="4" height="4" fill="#F4E4C1"/>
  <!-- pin point -->
  <rect x="14" y="15" width="4" height="4" fill="#C0392B"/>
  <rect x="15" y="19" width="2" height="3" fill="#C0392B"/>
  <!-- grass base -->
  <rect x="7" y="23" width="18" height="2" fill="#6DAA2C"/>
  <rect x="9" y="22" width="2" height="1" fill="#6DAA2C"/>
  <rect x="15" y="22" width="2" height="1" fill="#6DAA2C"/>
  <rect x="21" y="22" width="2" height="1" fill="#6DAA2C"/>
</svg>
